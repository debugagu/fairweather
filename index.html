<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairweather: weather advice for walking days</title>
<meta name="description" content="Enter a city and your dates. Fairweather tells you which days are good for walking and what to pack.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛰</text></svg>">
</head>
<body>

<a class="skip" href="#results">Skip to results</a>

<div class="page">

  <header class="masthead">
    <h1>Fairweather</h1>
    <p class="standfirst">
      Tells you which days of your trip are good for walking, and what to pack.
      The advice assumes you will be outdoors most of the day, away from shelter.
    </p>
  </header>

  <form id="search" class="search" novalidate>
    <div class="field field--city">
      <label for="city">City</label>
      <input id="city" name="city" type="text" autocomplete="off" spellcheck="false"
             placeholder="New Delhi" required>
    </div>
    <div class="field">
      <label for="start">From</label>
      <input id="start" name="start" type="date" required>
    </div>
    <div class="field">
      <label for="end">To</label>
      <input id="end" name="end" type="date" required>
    </div>
    <div class="field field--action">
      <button type="submit">Read the forecast</button>
    </div>
    <p class="field-note" id="range-note"></p>
  </form>

  <main id="results" class="results" aria-live="polite" aria-busy="false"></main>

  <footer class="colophon">
    <p>
      Forecast data from <a href="https://open-meteo.com" rel="noopener">Open-Meteo</a>,
      fetched live on each search.
    </p>
    <p>
      <a href="note.html">How the verdicts are decided</a>
    </p>
  </footer>

</div>

<!-- Templates -------------------------------------------------------------- -->

<template id="t-empty">
  <section class="state state--empty">
    <p class="state-lead">What this does</p>
    <p class="state-body">
      A forecast gives you numbers and leaves the decision to you. This reads the
      forecast for your exact dates and tells you which days are worth going out
      on.
    </p>
    <ul class="explain">
      <li>
        <b>A verdict for every day</b>
        <span>Good day, plan around it, or do not go, with the reason in one line.</span>
      </li>
      <li>
        <b>One packing list</b>
        <span>For the whole trip, not per day, built from what the weather actually does.</span>
      </li>
      <li>
        <b>A summary before the detail</b>
        <span>How the window looks overall, so you know before reading anything else.</span>
      </li>
    </ul>
    <p class="state-body state-body--quiet">
      The advice assumes a walking day: outdoors most of the time, away from
      shelter. Forecasts run up to 14 days ahead. Type a city above to start.
    </p>
  </section>
</template>

<template id="t-loading">
  <section class="state state--loading">
    <p class="state-lead" id="loading-line">Reading the forecast&hellip;</p>
    <div class="skeleton"><span></span><span></span><span></span></div>
  </section>
</template>

<template id="t-error">
  <section class="state state--error" role="alert">
    <p class="state-lead" data-slot="title"></p>
    <p class="state-body" data-slot="detail"></p>
    <p class="state-actions"><button type="button" data-action="retry">Try again</button></p>
  </section>
</template>

<template id="t-choose">
  <section class="state state--choose">
    <p class="state-lead" data-slot="title"></p>
    <p class="state-body">
      More than one place has this name. Pick the one you meant.
    </p>
    <ul class="choices" data-slot="list"></ul>
  </section>
</template>

<template id="t-results">
  <section class="report">

    <div class="place">
      <p class="place-name" data-slot="place"></p>
      <button type="button" class="linky" data-action="rechoose" hidden>Not this one?</button>
    </div>

    <p class="summary" data-slot="summary"></p>
    <p class="summary-sub" data-slot="summary-sub"></p>

    <h2 class="section-head">Day by day</h2>
    <ol class="days" data-slot="days"></ol>

    <h2 class="section-head">Pack for the whole trip</h2>
    <ul class="packing" data-slot="packing"></ul>
    <p class="packing-note">
      Weather items only. Boots, map, food and first aid are assumed.
    </p>

  </section>
</template>

<template id="t-day">
  <li class="day">
    <div class="day-head">
      <span data-slot="icon"></span>
      <p class="day-date"><span data-slot="weekday"></span> <span class="day-date-num" data-slot="date"></span></p>
    </div>
    <p class="day-band" data-slot="band"></p>
    <p class="day-verdict" data-slot="verdict"></p>
    <p class="day-window" data-slot="window"></p>
    <dl class="day-figures" data-slot="figures"></dl>
  </li>
</template>

<script type="module" src="js/main.js"></script>

</body>
</html>
